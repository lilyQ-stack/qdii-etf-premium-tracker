name: Validate fair-value model guards
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fair_value_model.py'
      - 'tests/test_fair_value_model.py'
      - '.github/workflows/test-fair-value-model.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test time and source validation
        run: python -m unittest discover -s tests -p 'test_fair_value_model.py' -v
