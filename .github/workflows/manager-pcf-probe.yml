name: Manager specific PCF source test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect fund-specific manager pages
        run: python scripts/probe_manager_pcf.py
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-specific-pcf-diagnostic
          path: output/manager_pcf_probe.json
          retention-days: 7
          if-no-files-found: warn
