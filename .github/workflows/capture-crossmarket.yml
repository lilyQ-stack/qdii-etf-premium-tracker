name: Capture cross market quote candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '3,8,13 6 * * 1-5'

permissions:
  contents: write
concurrency:
  group: crossmarket-candidate-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exchange calendar
        run: pip install "exchange-calendars>=4.5,<5" "pandas>=2.2,<3"
      - name: Capture reference quote snapshots
        run: python scripts/capture_china_crossmarket.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossmarket-quote-snapshot-diagnostic
          path: output/crossmarket_capture.json
          retention-days: 14
          if-no-files-found: warn
      - name: Store candidate snapshot CSV
        run: |
          if [[ -z "$(git status --porcelain -- data/crossmarket_quote_candidates.csv)" ]]; then
            echo "No new cross-market candidates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crossmarket_quote_candidates.csv
          git commit -m "Append timestamped auxiliary market quote candidates"
          git pull --rebase origin main
          git push origin HEAD:main
