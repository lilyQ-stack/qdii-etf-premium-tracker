name: Test cross market quote guards
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture_china_crossmarket.py'
      - 'tests/test_crossmarket_capture.py'
      - '.github/workflows/test-crossmarket-capture.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install "exchange-calendars>=4.5,<5" "pandas>=2.2,<3"
      - name: Run offline parser validation
        run: python -m unittest discover -s tests -p 'test_crossmarket_capture.py' -v
