name: ETF quote connectivity test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Sina and Tencent
        env:
          REPORT_PATH: output/diagnostic.json
        run: python scripts/check_quotes.py
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-connectivity-diagnostic
          path: output/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
