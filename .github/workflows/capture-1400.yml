name: ETF 14:00 minute capture
on:
  workflow_dispatch:
  schedule:
    # UTC 06:03/06:08/06:13 == 14:03/14:08/14:13 China time.
    # GitHub scheduled jobs may start late: the Python script fails closed.
    - cron: '3,8,13 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: qdii-1400-capture
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install A-share exchange calendar
        run: pip install "exchange-calendars>=4.5,<5" "pandas>=2.2,<3"
      - name: Fetch 14:00 minute rows
        run: python scripts/capture_1400.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-1400-diagnostic
          path: output/daily_capture.json
          retention-days: 14
          if-no-files-found: warn
      - name: Commit verified minute-labelled observations
        run: |
          if [[ -z "$(git status --porcelain -- data/verified_1400.csv)" ]]; then
            echo "No new validated minute rows"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified_1400.csv
          git commit -m "Record dated 14:00 Tencent minute observations"
          git pull --rebase origin main
          git push origin HEAD:main
