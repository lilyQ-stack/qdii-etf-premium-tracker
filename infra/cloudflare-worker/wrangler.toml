name = "qdii-etf-cron-dispatcher"
main = "worker.js"
compatibility_date = "2026-10-23"
[triggers]
crons = ["4,9,14 6 * * MON-FRI"]

# Store the fine-grained GitHub token in Worker secrets using:
# npx wrangler secret put GITHUB_TOKEN
# Token: ONLY lilyQ-stack/qdii-etf-premium-tracker, Actions read and write.
# Never commit access tokens.
